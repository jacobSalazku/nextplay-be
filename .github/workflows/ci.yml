name: CI

# every push on every branch, plus PRs from forks
on:
  push:
  pull_request:

# a newer commit on the same ref cancels the in-flight run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # dummy values so the Nest module graph builds; no DB is touched during
      # the schema check (SKIP_DB_CONNECT), and no tokens are signed. The test
      # step overrides DATABASE_URL from .env.test (the service container below).
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      GOOGLE_CLIENT_ID: ci
    services:
      # matches .env.test / docker-compose.test.yml so the global-setup guard
      # accepts it and local + CI run identically
      test-db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nextplay
          POSTGRES_PASSWORD: nextplay
          POSTGRES_DB: nextplay_test
        ports:
          - '5433:5432'
        options: >-
          --health-cmd "pg_isready -U nextplay -d nextplay_test"
          --health-interval 1s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate

      - name: Ephemeral JWT keypair (schema check only)
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/jwt.pem
          openssl rsa -in /tmp/jwt.pem -pubout -out /tmp/jwt.pub
          echo "JWT_PRIVATE_KEY_BASE64=$(base64 -w0 /tmp/jwt.pem)" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY_BASE64=$(base64 -w0 /tmp/jwt.pub)" >> "$GITHUB_ENV"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"

      - name: Unit tests
        # jest directly, not `pnpm test` — the `pretest` hook spins up a local
        # docker-compose DB, but CI already has the Postgres service container.
        run: pnpm exec jest

      - name: GraphQL schema is in sync with the resolvers
        run: pnpm schema:check

      - name: E2E tests
        run: pnpm test:e2e
